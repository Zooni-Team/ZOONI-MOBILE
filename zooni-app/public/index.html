<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />

    <!--
      Plantilla propia del index.html de Expo web (expo export la toma de
      public/index.html en vez de la que trae @expo/cli).

      Motivo: en el celular la web se comportaba como una página y no como una
      app — doble tap y pellizco hacían zoom, el rebote de iOS despegaba la
      pantalla del borde y al tocar un input Safari acercaba la vista sola.
      Los ajustes de abajo son los que hacen que se sienta nativa.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />

    <!-- Modo app al agregarla a la pantalla de inicio (iOS / Android) -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Zooni" />
    <meta name="theme-color" content="#C8F0D8" />
    <!-- Que el navegador no convierta teléfonos y fechas en links azules -->
    <meta name="format-detection" content="telephone=no,date=no,address=no,email=no" />

    <title>%WEB_TITLE%</title>

    <!--
      Reset de react-native-web + ajustes de "modo app" de Zooni, en un
      archivo aparte (antes en línea acá): un <style> en línea complica una
      CSP estricta sin "unsafe-inline" (informe de seguridad #145).
    -->
    <link rel="stylesheet" href="/app-shell.css" />
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>

    <script src="/touch-fix.js"></script>
  </body>
</html>
